<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REITO Catch: Arcade Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF7E5F;
            --secondary: #FEB47B;
            --bg-dark: #121212;
            --panel-bg: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-dark), #2a2a2a);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: none;
        }
        #game-container {
            position: relative;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 360px;
        }
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }
        h1 {
            margin: 0;
            font-size: 1.4rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            border: 1px solid rgba(255, 126, 95, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #powerup-status { color: var(--secondary); font-size: 1.2rem; }
        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.6);
        }
        canvas { background: #1a1a1a; display: block; }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay h2 { font-size: 2rem; margin: 0 0 10px 0; color: var(--primary); }
        .overlay p { font-size: 1.1rem; margin-bottom: 25px; color: #ddd; }
        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            color: #121212;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 126, 95, 0.4);
        }
        .studio-credit { margin-top: 15px; font-size: 0.85rem; color: #777; }
        .studio-credit span { color: var(--secondary); font-weight: 600; }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <h1>REITO Catch</h1>
            <div class="stats-bar">
                <div class="stat-box">Nyawa: <span id="lives">❤️❤️❤️</span></div>
                <div class="stat-box"><span id="powerup-status"></span> Skor: <span id="score">0</span></div>
            </div>
        </header>
        
        <div class="canvas-wrapper" id="canvas-wrapper">
            <canvas id="gameCanvas" width="360" height="480"></canvas>
            
            <!-- Layar Mulai Awal (Dibutuhkan untuk izin Audio) -->
            <div id="startScreen" class="overlay show">
                <h2>Siap Menangkap?</h2>
                <p>Kumpulkan Dimsum, hindari rintangan!</p>
                <button id="startBtn">Mulai Game</button>
            </div>

            <!-- Layar Game Over -->
            <div id="gameOverScreen" class="overlay">
                <h2>Game Over!</h2>
                <p>Skor Akhir: <span id="final-score">0</span></p>
                <button id="restartBtn">Main Lagi</button>
            </div>
        </div>
    </div>

    <div class="studio-credit">Powered by <span>Asobi Works</span></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const powerupStatusEl = document.getElementById('powerup-status');
        
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        
        // ---- SISTEM AUDIO (Sintesis 8-Bit) ----
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let bgmInterval;
        const bgmNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; // Arpeggio C Major
        let noteIdx = 0;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'damage') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'powerup') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function playBGMNote() {
            if (!audioCtx || isGameOver) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = bgmNotes[noteIdx];
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            
            osc.start(now);
            osc.stop(now + 0.2);
            noteIdx = (noteIdx + 1) % bgmNotes.length;
        }

        // ---- STATE GAME ----
        let score = 0, lives = 3, isGameOver = true, frameCount = 0;
        let baseSpeed = 3, fallingItems = [], particles = [];
        let powerupTimer = { slow: 0, magnet: 0 };
        
        const player = { x: canvas.width / 2, y: canvas.height - 40, speed: 7, dx: 0, emoji: '🧺' };

        const itemConfig = [
            { emoji: '🥟', type: 'food', points: 1, speedMult: 1, prob: 50 },
            { emoji: '🍤', type: 'food', points: 2, speedMult: 1.5, prob: 20 },
            { emoji: '🌯', type: 'food', points: 3, speedMult: 1.2, prob: 10 },
            { emoji: '🌶️', type: 'trap', points: -2, speedMult: 1, prob: 10 },
            { emoji: '💣', type: 'bomb', points: 0, speedMult: 1.6, prob: 5 },
            { emoji: '⏳', type: 'slow', points: 0, speedMult: 1.2, prob: 2.5 },
            { emoji: '🧲', type: 'magnet', points: 0, speedMult: 1.2, prob: 2.5 }
        ];

        // ---- PARTIKEL VISUAL ----
        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;

                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // ---- LOGIKA UTAMA ----
        function spawnItem() {
            const rand = Math.random() * 100;
            let cumulative = 0, selectedItem = itemConfig[0];
            for (let item of itemConfig) {
                cumulative += item.prob;
                if (rand <= cumulative) { selectedItem = item; break; }
            }
            fallingItems.push({ x: Math.random() * (canvas.width - 50) + 25, y: -30, ...selectedItem });
        }

        function takeDamage(isBomb) {
            lives--;
            playSound('damage');
            let hearts = "";
            for(let i=0; i<lives; i++) hearts += "❤️";
            livesEl.innerText = hearts === "" ? "💀" : hearts;
            
            wrapper.style.boxShadow = "inset 0 0 40px rgba(255, 0, 0, 0.8)";
            setTimeout(() => { if(!isGameOver) wrapper.style.boxShadow = "inset 0 4px 15px rgba(0,0,0,0.6)"; }, 200);

            if (lives <= 0) endGame();
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            // Timer Power-up
            if (powerupTimer.slow > 0) powerupTimer.slow--;
            if (powerupTimer.magnet > 0) powerupTimer.magnet--;
            
            // Update UI Powerup
            let statusText = "";
            if (powerupTimer.slow > 0) statusText += "⏳";
            if (powerupTimer.magnet > 0) statusText += "🧲";
            powerupStatusEl.innerText = statusText;

            let currentSpawnInterval = Math.max(20, 70 - Math.floor(score / 15) * 5);
            if (frameCount % currentSpawnInterval === 0) spawnItem();

            let currentSpeed = baseSpeed + (score * 0.02);
            if (powerupTimer.slow > 0) currentSpeed *= 0.4; // Waktu melambat

            player.x += player.dx;
            if (player.x < 30) player.x = 30;
            if (player.x > canvas.width - 30) player.x = canvas.width - 30;

            for (let i = fallingItems.length - 1; i >= 0; i--) {
                let item = fallingItems[i];

                // Efek Magnet
                if (powerupTimer.magnet > 0 && item.type === 'food') {
                    let dx = player.x - item.x;
                    let dy = player.y - item.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 180) { // Jarak tarikan magnet
                        item.x += (dx / dist) * 4;
                        item.y += (dy / dist) * 4;
                    }
                }

                item.y += currentSpeed * item.speedMult;
                ctx.font = '35px Arial';
                ctx.fillText(item.emoji, item.x, item.y);

                let distY = Math.abs(item.y - player.y);
                let distX = Math.abs(item.x - player.x);

                if (distY < 30 && distX < 40) {
                    if (item.type === 'food') {
                        score += item.points;
                        playSound('pop');
                        createParticles(item.x, item.y, '#FFD700');
                    } else if (item.type === 'trap') {
                        score = Math.max(0, score + item.points);
                        playSound('damage');
                    } else if (item.type === 'bomb') {
                        takeDamage(true);
                    } else if (item.type === 'slow') {
                        powerupTimer.slow = 300; // ~5 detik
                        playSound('powerup');
                    } else if (item.type === 'magnet') {
                        powerupTimer.magnet = 400; // ~6.5 detik
                        playSound('powerup');
                    }
                    
                    document.getElementById('score').innerText = score;
                    fallingItems.splice(i, 1);
                    continue;
                }

                if (item.y > canvas.height + 20) {
                    if (item.type === 'food') takeDamage(false);
                    fallingItems.splice(i, 1);
                }
            }

            drawParticles();
            ctx.font = '45px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(player.emoji, player.x, player.y);

            requestAnimationFrame(update);
        }

        function startGame() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            isGameOver = false;
            score = 0; lives = 3; frameCount = 0; fallingItems = []; particles = [];
            powerupTimer = { slow: 0, magnet: 0 };
            document.getElementById('score').innerText = score;
            livesEl.innerText = "❤️❤️❤️";
            player.x = canvas.width / 2;
            
            startScreen.classList.remove('show');
            gameOverScreen.classList.remove('show');
            
            clearInterval(bgmInterval);
            bgmInterval = setInterval(playBGMNote, 200); // Mulai BGM

            update();
        }

        function endGame() {
            isGameOver = true;
            clearInterval(bgmInterval); // Matikan BGM
            document.getElementById('final-score').innerText = score;
            gameOverScreen.classList.add('show');
        }

        // ---- KONTROL ----
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') player.dx = -player.speed;
            if (e.key === 'ArrowRight') player.dx = player.speed;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.dx = 0;
        });
        function handleMove(e) {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            if (clientX) {
                let x = clientX - rect.left;
                if (x > 30 && x < canvas.width - 30) player.x = x;
            }
        }
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', handleMove, { passive: true });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
    </script>
</body>
</html>
