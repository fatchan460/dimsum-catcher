<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REITO Catch</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF7E5F;
            --secondary: #FEB47B;
            --bg-dark: #121212;
            --panel-bg: rgba(255, 255, 255, 0.08);
        }
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-dark), #2a2a2a);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: none; /* Mencegah layar ter-scroll saat disentuh di HP */
        }
        #game-container {
            position: relative;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 5px;
        }
        h1 {
            margin: 0;
            font-size: 1.4rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .score-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 126, 95, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.6);
        }
        canvas {
            background: #1a1a1a;
            display: block;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        #overlay h2 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: var(--primary);
        }
        #overlay p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #ddd;
        }
        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            color: #121212;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 126, 95, 0.4);
        }
        .studio-credit {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #777;
            letter-spacing: 0.5px;
        }
        .studio-credit span {
            color: var(--secondary);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <h1>REITO Catch</h1>
            <div class="score-box">Skor: <span id="score">0</span></div>
        </header>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="360" height="480"></canvas>
            
            <div id="overlay">
                <h2>Game Over!</h2>
                <p>Skor Akhir: <span id="final-score">0</span></p>
                <button id="restartBtn">Main Lagi</button>
            </div>
        </div>
    </div>

    <div class="studio-credit">Powered by <span>Asobi Works</span></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0;
        let isGameOver = false;
        let animationId;
        
        // Menggunakan emoji sebagai grafis utama (anti-error render)
        const basketEmoji = '🧺';
        const dimsumEmoji = '🥟';

        // State Pemain
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 40,
            speed: 7,
            dx: 0
        };

        // State Dimsum
        const item = {
            x: Math.random() * (canvas.width - 40) + 20,
            y: -30,
            speed: 3
        };

        function drawPlayer() {
            ctx.font = '45px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(basketEmoji, player.x, player.y);
        }

        function drawItem() {
            ctx.font = '35px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(dimsumEmoji, item.x, item.y);
        }

        function resetItem() {
            item.y = -30;
            item.x = Math.random() * (canvas.width - 50) + 25;
            item.speed += 0.25; // Kesulitan meningkat secara bertahap
        }

        function update() {
            if (isGameOver) return;

            // Bersihkan frame sebelumnya
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pergerakan pemain (keyboard)
            player.x += player.dx;
            
            // Batas layar untuk pemain
            if (player.x < 30) player.x = 30;
            if (player.x > canvas.width - 30) player.x = canvas.width - 30;

            // Pergerakan dimsum
            item.y += item.speed;

            // Deteksi Tabrakan (Hitbox disesuaikan dengan ukuran font emoji)
            let distY = Math.abs(item.y - player.y);
            let distX = Math.abs(item.x - player.x);

            if (distY < 30 && distX < 40) {
                score++;
                scoreEl.innerText = score;
                resetItem();
            }

            // Gagal menangkap (melewati batas bawah)
            if (item.y > canvas.height + 20) {
                endGame();
                return;
            }

            // Gambar elemen
            drawPlayer();
            drawItem();

            animationId = requestAnimationFrame(update);
        }

        function endGame() {
            isGameOver = true;
            finalScoreEl.innerText = score;
            overlay.classList.add('show');
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            scoreEl.innerText = score;
            item.speed = 3;
            item.y = -30;
            player.x = canvas.width / 2;
            overlay.classList.remove('show');
            update();
        }

        // --- Kontrol ---

        // Input Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') player.dx = -player.speed;
            if (e.key === 'ArrowRight') player.dx = player.speed;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.dx = 0;
        });

        // Input Mouse / Sentuhan (Paling responsif)
        function handleMove(e) {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            
            let clientX = e.clientX;
            // Deteksi jika dari layar sentuh
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
            }
            
            if (clientX) {
                let x = clientX - rect.left;
                if (x > 30 && x < canvas.width - 30) {
                    player.x = x;
                }
            }
        }

        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', handleMove, { passive: true });

        // Tombol Restart
        restartBtn.addEventListener('click', restartGame);

        // Inisiasi Game
        update();
    </script>
</body>
</html>
