<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REITO Catch: Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palet Warna dari Logo REITO */
            --reito-blue: #000B63; 
            --reito-yellow: #FFDE00;
            --bg-light: #F4F7FB;
            --text-dark: #1A1A1A;
            --wa-color: #25D366;
            --wa-hover: #1EBE57;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #E0E8F5, #FFFFFF);
            color: var(--text-dark);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: none;
        }
        #game-container {
            position: relative;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 24px 20px 20px 20px;
            box-shadow: 0 12px 40px rgba(0, 11, 99, 0.15);
            border: 2px solid rgba(0, 11, 99, 0.05);
            text-align: center;
            width: 360px;
        }
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            gap: 12px;
        }
        /* Penempatan Logo */
        .brand-logo {
            width: 140px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 5px;
        }
        .stat-box {
            background: #FFFFFF;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--reito-blue);
            border: 2px solid var(--reito-yellow);
            box-shadow: 0 4px 10px rgba(255, 222, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #powerup-status { color: var(--reito-blue); font-size: 1.2rem; }
        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid var(--reito-blue);
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.05);
        }
        /* Latar Belakang Area Game Terang */
        canvas { background: #EEF2F7; display: block; }
        
        /* Overlays Terang */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
        .overlay h2 { font-size: 2rem; margin: 0 0 5px 0; color: var(--reito-blue); }
        .overlay p { font-size: 1rem; margin-bottom: 15px; color: var(--text-dark); text-align: center; padding: 0 15px;}
        
        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 85%;
            margin-top: 10px;
        }
        button {
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .btn-play {
            background: var(--reito-blue);
            color: var(--reito-yellow);
            border: 2px solid var(--reito-blue);
        }
        .btn-play:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 11, 99, 0.3);
        }
        .btn-wa {
            background: var(--wa-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-wa:hover {
            background: var(--wa-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }

        /* Promo Box */
        #promo-container {
            display: none; 
            background: rgba(255, 222, 0, 0.15);
            border: 2px dashed var(--reito-yellow);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }
        #promo-container p { margin: 0 0 8px 0; color: var(--reito-blue); font-size: 0.95rem; font-weight: 700;}
        .promo-code {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--reito-yellow);
            background: var(--reito-blue);
            padding: 8px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .screenshot-hint { font-size: 0.8rem !important; color: #555 !important; margin: 0 !important; font-weight: 400 !important;}

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 222, 0, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(255, 222, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 222, 0, 0); }
        }

        .studio-credit { margin-top: 20px; font-size: 0.85rem; color: #777; font-weight: 500;}
        .studio-credit span { color: var(--reito-blue); font-weight: 700; }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <img src="reito-01 (1).png" alt="REITO Logo" class="brand-logo">
            <div class="stats-bar">
                <div class="stat-box"><span id="lives">❤️❤️❤️</span></div>
                <div class="stat-box"><span id="powerup-status"></span> Skor: <span id="score">0</span></div>
            </div>
        </header>
        
        <div class="canvas-wrapper" id="canvas-wrapper">
            <canvas id="gameCanvas" width="360" height="440"></canvas>
            
            <!-- Layar Mulai Awal -->
            <div id="startScreen" class="overlay show">
                <h2>Siap Menangkap?</h2>
                <p>Cetak skor 100 untuk membuka kode voucher diskon rahasia!</p>
                <div class="btn-group">
                    <button id="startBtn" class="btn-play">Mulai Game</button>
                    <button class="btn-wa" onclick="orderWA()">📱 Pesan Dimsum</button>
                </div>
            </div>

            <!-- Layar Game Over -->
            <div id="gameOverScreen" class="overlay">
                <h2>Game Over!</h2>
                <p style="margin-bottom: 5px;">Skor Akhir: <span id="final-score" style="font-weight: 800; color: var(--reito-blue); font-size: 1.2rem;">0</span></p>
                
                <!-- Kotak Promo -->
                <div id="promo-container">
                    <p>🎉 SELAMAT! VOUCHER TERBUKA 🎉</p>
                    <div class="promo-code">REITO-10K</div>
                    <p class="screenshot-hint">Screenshot layar ini & kirim ke admin!</p>
                </div>

                <div class="btn-group">
                    <button id="restartBtn" class="btn-play">Main Lagi</button>
                    <button class="btn-wa" onclick="orderWA()">📱 Klaim via WA</button>
                </div>
            </div>
        </div>
    </div>

    <div class="studio-credit">Powered by <span>Asobi Works</span></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const powerupStatusEl = document.getElementById('powerup-status');
        
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const promoContainer = document.getElementById('promo-container');
        
        const TARGET_SCORE_PROMO = 100; 

        // ---- FUNGSI CTA WHATSAPP ----
        function orderWA() {
            const waNumber = "6280000000000"; 
            let waText = "Halo Admin REITO, saya mau pesan Daging Olahan Premium nya!";
            
            if (score >= TARGET_SCORE_PROMO) {
                waText = "Halo Admin REITO, saya dapat skor " + score + " di game REITO Catch dan mau klaim kode promo REITO-10K! Ini pesanan saya...";
            }
            
            const encodedText = encodeURIComponent(waText);
            window.open(`https://wa.me/${waNumber}?text=${encodedText}`, '_blank');
        }

        // ---- SISTEM AUDIO ----
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let bgmInterval;
        const bgmNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; 
        let noteIdx = 0;

        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'damage') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'powerup') {
                osc.type = 'square'; osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function playBGMNote() {
            if (!audioCtx || isGameOver) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.value = bgmNotes[noteIdx];
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0.015, now); 
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
            noteIdx = (noteIdx + 1) % bgmNotes.length;
        }

        // ---- STATE GAME ----
        let score = 0, lives = 3, isGameOver = true, frameCount = 0;
        let baseSpeed = 3.5, fallingItems = [], particles = []; 
        let powerupTimer = { slow: 0, magnet: 0 };
        
        const player = { x: canvas.width / 2, y: canvas.height - 40, speed: 7, dx: 0, emoji: '🧺' };

        const itemConfig = [
            { emoji: '🥟', type: 'food', points: 1, speedMult: 1, prob: 50 },
            { emoji: '🍤', type: 'food', points: 2, speedMult: 1.5, prob: 20 },
            { emoji: '🌯', type: 'food', points: 3, speedMult: 1.2, prob: 10 },
            { emoji: '🌶️', type: 'trap', points: -2, speedMult: 1, prob: 10 },
            { emoji: '💣', type: 'bomb', points: 0, speedMult: 1.6, prob: 5 },
            { emoji: '⏳', type: 'slow', points: 0, speedMult: 1.2, prob: 2.5 },
            { emoji: '🧲', type: 'magnet', points: 0, speedMult: 1.2, prob: 2.5 }
        ];

        function createParticles(x, y, isBlue = false) {
            const color = isBlue ? '#000B63' : '#FFDE00'; 
            for (let i = 0; i < 12; i++) {
                particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 1, color: color });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.fill();
                ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function spawnItem() {
            const rand = Math.random() * 100;
            let cumulative = 0, selectedItem = itemConfig[0];
            for (let item of itemConfig) {
                cumulative += item.prob;
                if (rand <= cumulative) { selectedItem = item; break; }
            }
            fallingItems.push({ x: Math.random() * (canvas.width - 50) + 25, y: -30, ...selectedItem });
        }

        function takeDamage(isBomb) {
            lives--; playSound('damage');
            let hearts = ""; for(let i=0; i<lives; i++) hearts += "❤️";
            livesEl.innerText = hearts === "" ? "💀" : hearts;
            
            wrapper.style.boxShadow = "inset 0 0 40px rgba(255, 0, 0, 0.4)";
            wrapper.style.borderColor = "red";
            setTimeout(() => { 
                if(!isGameOver) {
                    wrapper.style.boxShadow = "inset 0 4px 15px rgba(0,0,0,0.05)"; 
                    wrapper.style.borderColor = "#000B63";
                }
            }, 200);

            if (lives <= 0) endGame();
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            if (powerupTimer.slow > 0) powerupTimer.slow--;
            if (powerupTimer.magnet > 0) powerupTimer.magnet--;
            
            let statusText = "";
            if (powerupTimer.slow > 0) statusText += "⏳";
            if (powerupTimer.magnet > 0) statusText += "🧲";
            powerupStatusEl.innerText = statusText;

            let currentSpawnInterval = Math.max(20, 70 - Math.floor(score / 15) * 5);
            if (frameCount % currentSpawnInterval === 0) spawnItem();

            let currentSpeed = baseSpeed + (score * 0.02);
            if (powerupTimer.slow > 0) currentSpeed *= 0.4; 

            player.x += player.dx;
            if (player.x < 30) player.x = 30;
            if (player.x > canvas.width - 30) player.x = canvas.width - 30;

            for (let i = fallingItems.length - 1; i >= 0; i--) {
                let item = fallingItems[i];

                if (powerupTimer.magnet > 0 && item.type === 'food') {
                    let dx = player.x - item.x, dy = player.y - item.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 180) { item.x += (dx / dist) * 4; item.y += (dy / dist) * 4; }
                }

                item.y += currentSpeed * item.speedMult;
                ctx.font = '35px Arial'; ctx.fillText(item.emoji, item.x, item.y);

                let distY = Math.abs(item.y - player.y), distX = Math.abs(item.x - player.x);

                if (distY < 30 && distX < 40) {
                    if (item.type === 'food') {
                        score += item.points; 
                        playSound('pop'); 
                        createParticles(item.x, item.y, Math.random() > 0.5);
                    } else if (item.type === 'trap') {
                        score = Math.max(0, score + item.points); playSound('damage');
                    } else if (item.type === 'bomb') {
                        takeDamage(true);
                    } else if (item.type === 'slow') {
                        powerupTimer.slow = 300; playSound('powerup');
                    } else if (item.type === 'magnet') {
                        powerupTimer.magnet = 400; playSound('powerup');
                    }
                    
                    document.getElementById('score').innerText = score;
                    fallingItems.splice(i, 1);
                    continue;
                }
                if (item.y > canvas.height + 20) {
                    if (item.type === 'food') takeDamage(false);
                    fallingItems.splice(i, 1);
                }
            }

            drawParticles();
            ctx.font = '45px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(player.emoji, player.x, player.y);
            requestAnimationFrame(update);
        }

        function startGame() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            isGameOver = false; score = 0; lives = 3; frameCount = 0; fallingItems = []; particles = [];
            powerupTimer = { slow: 0, magnet: 0 };
            document.getElementById('score').innerText = score;
            livesEl.innerText = "❤️❤️❤️";
            player.x = canvas.width / 2;
            
            startScreen.classList.remove('show');
            gameOverScreen.classList.remove('show');
            promoContainer.style.display = 'none'; 
            
            clearInterval(bgmInterval);
            bgmInterval = setInterval(playBGMNote, 200); 
            update();
        }

        function endGame() {
            isGameOver = true;
            clearInterval(bgmInterval); 
            document.getElementById('final-score').innerText = score;
            
            if (score >= TARGET_SCORE_PROMO) {
                promoContainer.style.display = 'block';
            } else {
                promoContainer.style.display = 'none';
            }

            gameOverScreen.classList.add('show');
        }

        // ---- KONTROL ----
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') player.dx = -player.speed;
            if (e.key === 'ArrowRight') player.dx = player.speed;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.dx = 0;
        });
        function handleMove(e) {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            if (clientX) {
                let x = clientX - rect.left;
                if (x > 30 && x < canvas.width - 30) player.x = x;
            }
        }
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', handleMove, { passive: true });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
    </script>
</body>
</html>
